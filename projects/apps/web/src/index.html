<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Items</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main>
    <header>
        <h1>Items</h1>
        <p class="sub">Typed client over <code>@chaos/api</code> — every call below is <code>hc&lt;AppType&gt;</code>.</p>
        <div class="role">
            <label for="role">Acting as</label>
            <select id="role">
                <option value="anonymous">anonymous — read only</option>
                <option value="member" selected>member — can create</option>
                <option value="admin">admin — can delete</option>
            </select>
            <span class="hint">demo switch: a real client never picks its own role</span>
        </div>
    </header>

    <form id="create">
        <input id="name" placeholder="New item name" autocomplete="off" required>
        <button type="submit">Create</button>
    </form>
    <p class="error" id="error" hidden></p>

    <section>
        <div class="row">
            <h2>Recent</h2>
            <label>limit <input id="limit" type="number" min="1" max="100" value="20"></label>
        </div>
        <ul id="items"></ul>
        <p class="empty" id="empty" hidden>No items yet.</p>
    </section>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
