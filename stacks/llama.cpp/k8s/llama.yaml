apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
# Headless service required by the StatefulSet for stable pod DNS.
apiVersion: v1
kind: Service
metadata:
  name: llama-server-headless
  namespace: llm
spec:
  clusterIP: None
  selector:
    app: llama-server
  ports:
    - name: http
      port: 8080
---
# Load-balances across replicas. This is the address clients use.
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: llm
spec:
  selector:
    app: llama-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llama-server
  namespace: llm
spec:
  serviceName: llama-server-headless
  replicas: 2
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      # One replica per worker; both cpx62 nodes are fully committed to inference.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: llama-server
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: fetch-model
          image: curlimages/curl:latest
          # curlimages/curl runs as a non-root user, but a freshly provisioned
          # hcloud volume is owned by root, so the download cannot be written.
          securityContext:
            runAsUser: 0
          env:
            - name: MODEL_FILE
              value: Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
            - name: MODEL_URL
              value: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
          command:
            - sh
            - -c
            - |
              set -e
              F="/models/$MODEL_FILE"
              if [ -f "$F" ]; then echo "model present, skipping"; exit 0; fi
              curl -fL --retry 5 --retry-delay 10 -o "$F.part" "$MODEL_URL"
              mv "$F.part" "$F"
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - -m
            - /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            # 16 vCPU on cpx62; leave 2 for kubelet, CNI and everything else.
            - -t
            - "14"
            # Total KV budget, split across slots: 4 x 4096 per conversation.
            - -c
            - "16384"
            # Slots add real capacity on CPU — batching reads the weights once
            # per step for N tokens. See BENCHMARKS.md.
            - --parallel
            - "4"
            - --jinja
            - --metrics
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "14"
              memory: 24Gi
            # No cpu limit on purpose: llama.cpp's inference threads spin, and
            # cgroup CFS throttling wrecks throughput.
            # 22 GB of weights on a 30 GiB node: this sits at ~28.6 GiB in
            # use, with no room to raise -c further.
            limits:
              memory: 29Gi
          # The init container downloads 22 GB before the server loads it;
          # without this the liveness probe kills the pod mid-load and it
          # restarts forever.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 30Gi
